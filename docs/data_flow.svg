<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1640" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowLoop" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .lbl   { fill:#475569; font-size:14px; }
      .sub   { fill:#475569; font-size:13px; }
      .mono  { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:12px; }
      .title { font-size:27px; font-weight:700; fill:#0f172a; }
      .stitle{ font-size:15px; fill:#475569; }
      .tag   { font-size:12px; font-weight:700; }
      .h16   { font-size:16px; font-weight:700; }
      .h15   { font-size:15px; font-weight:700; }
      .h14   { font-size:14px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1640" fill="#ffffff"/>

  <text x="560" y="46" text-anchor="middle" class="title">The Negotiator — Data Flow</text>
  <text x="560" y="76" text-anchor="middle" class="stitle">Documents → playbook extraction → arsenal + next move + escalation gate → user-driven negotiation loop</text>

  <!-- Legend -->
  <g>
    <rect x="1012" y="96" width="252" height="232" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="1032" y="124" class="h15" fill="#0f172a">Legend</text>
    <rect x="1032" y="138" width="20" height="15" rx="4" fill="#ccfbf1" stroke="#0d9488"/><text x="1062" y="150" class="lbl">AI / VLM — non-deterministic</text>
    <rect x="1032" y="166" width="20" height="15" rx="4" fill="#fef3c7" stroke="#d97706"/><text x="1062" y="178" class="lbl">Validation / normalization</text>
    <rect x="1032" y="194" width="20" height="15" rx="4" fill="#dcfce7" stroke="#16a34a"/><text x="1062" y="206" class="lbl">Deterministic — auditable</text>
    <rect x="1032" y="222" width="20" height="15" rx="4" fill="#ede9fe" stroke="#7c3aed"/><text x="1062" y="234" class="lbl">Result to user</text>
    <rect x="1032" y="250" width="20" height="15" rx="4" fill="#fee2e2" stroke="#dc2626"/><text x="1062" y="262" class="lbl">Escalation off-ramp</text>
    <rect x="1032" y="278" width="20" height="15" rx="4" fill="#e5e7eb" stroke="#6b7280"/><text x="1062" y="290" class="lbl">User / orchestration</text>
    <line x1="1032" y1="307" x2="1052" y2="307" stroke="#2563eb" stroke-width="3"/><text x="1062" y="311" class="lbl">User-driven round loop</text>
  </g>

  <!-- N1 User -->
  <g>
    <rect x="300" y="100" width="520" height="66" rx="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="560" y="128" text-anchor="middle" class="h16" fill="#111827">User — drops documents (and each round, reports back)</text>
    <text x="560" y="150" text-anchor="middle" class="sub">tenancy agreement · bank statement · scheme screenshots · landlord's reply</text>
  </g>
  <line x1="560" y1="166" x2="560" y2="202" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- N2 Orchestrator -->
  <g>
    <rect x="300" y="204" width="520" height="92" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="560" y="232" text-anchor="middle" class="h16" fill="#1e3a8a">Orchestrator (upload handler / API)</text>
    <text x="560" y="255" text-anchor="middle" class="sub">build CaseInput; pick domain; declare the negotiation round (stage)</text>
    <text x="560" y="278" text-anchor="middle" class="mono" fill="#1e3a8a">CaseInput { documents[], domain, context.stage }</text>
  </g>
  <line x1="560" y1="296" x2="560" y2="332" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="320" class="mono" fill="#475569">CaseInput</text>

  <!-- evaluateCase container -->
  <rect x="270" y="334" width="580" height="820" rx="16" fill="#f8fafc" stroke="#334155" stroke-dasharray="6 5"/>
  <text x="290" y="364" class="h16" fill="#0f172a">evaluateCase()  —  domain-agnostic</text>

  <!-- B1 pick playbook -->
  <g>
    <rect x="300" y="378" width="520" height="56" rx="10" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="560" y="400" text-anchor="middle" class="h14" fill="#111827">getPlaybook(domain)  —  registry seam</text>
    <text x="560" y="420" text-anchor="middle" class="mono" fill="#1e293b">deposit_return  |  employment_termination  |  …add a playbook</text>
  </g>
  <line x1="560" y1="434" x2="560" y2="462" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B2 VLM extract -->
  <g>
    <rect x="300" y="464" width="520" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <rect x="300" y="464" width="92" height="22" rx="10" fill="#0d9488"/>
    <text x="346" y="480" text-anchor="middle" class="tag" fill="#ffffff">VLM · AI</text>
    <text x="560" y="506" text-anchor="middle" class="h14" fill="#134e4a">provider.extract(documents, playbook.extraction)</text>
    <text x="560" y="527" text-anchor="middle" class="sub">Claude tool-use / Gemini responseSchema — the playbook's schema</text>
    <text x="560" y="547" text-anchor="middle" class="sub">reads facts + cites source doc · does NOT decide the law</text>
  </g>
  <line x1="560" y1="568" x2="560" y2="596" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="586" class="lbl">raw JSON</text>

  <!-- B3 normalize -->
  <g>
    <rect x="300" y="598" width="520" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="300" y="598" width="118" height="22" rx="10" fill="#d97706"/>
    <text x="359" y="614" text-anchor="middle" class="tag" fill="#ffffff">VALIDATE</text>
    <text x="560" y="640" text-anchor="middle" class="h14" fill="#7c2d12">playbook.normalize()</text>
    <text x="560" y="660" text-anchor="middle" class="sub">coerce dates/amounts · apply context (stage) · fail loudly on bad facts</text>
  </g>
  <line x1="560" y1="672" x2="560" y2="700" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="690" class="mono" fill="#475569">typed domain case</text>

  <!-- assess container -->
  <rect x="290" y="702" width="540" height="438" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="290" y="702" width="150" height="24" rx="11" fill="#16a34a"/>
  <text x="365" y="719" text-anchor="middle" class="tag" fill="#ffffff">DETERMINISTIC</text>
  <text x="560" y="748" text-anchor="middle" class="h15" fill="#14532d">playbook.assess()  —  rules engine</text>

  <g>
    <rect x="320" y="762" width="480" height="50" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="560" y="783" text-anchor="middle" class="h14" fill="#14532d">classify() — decision tree</text>
    <text x="560" y="801" text-anchor="middle" class="sub">facts → branch</text>
  </g>
  <line x1="560" y1="812" x2="560" y2="832" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="320" y="834" width="480" height="50" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="560" y="855" text-anchor="middle" class="h14" fill="#14532d">computeKeyDates() + buildTools()</text>
    <text x="560" y="873" text-anchor="middle" class="sub">the full arsenal — every tool with its deadline ("when to fire it")</text>
  </g>
  <line x1="560" y1="884" x2="560" y2="904" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="320" y="906" width="480" height="96" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="560" y="928" text-anchor="middle" class="h14" fill="#14532d">escalationFor() + buildNextMove()</text>
    <text x="560" y="948" text-anchor="middle" class="sub">Voss: gather information before deciding</text>
    <text x="560" y="967" text-anchor="middle" class="sub">escalation: self_serve · monitor · escalate</text>
    <text x="560" y="986" text-anchor="middle" class="sub">nextMove: the one move for this round (arsenal stays whole)</text>
  </g>
  <text x="560" y="1030" text-anchor="middle" class="mono" fill="#14532d">CaseAssessment { branch, tools[], nextMove, escalation }</text>

  <!-- out of evaluateCase -->
  <line x1="560" y1="1154" x2="560" y2="1190" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="570" y="1178" class="mono" fill="#475569">DomainAssessment</text>

  <!-- N3 result to user -->
  <g>
    <rect x="300" y="1192" width="520" height="104" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="560" y="1220" text-anchor="middle" class="h16" fill="#5b21b6">User sees: the arsenal + next move + escalation</text>
    <text x="560" y="1243" text-anchor="middle" class="sub">all tools with deadlines · the calibrated demand letter · what to do now</text>
    <text x="560" y="1265" text-anchor="middle" class="sub">+ extraction provenance (every fact cites its source document)</text>
    <text x="560" y="1285" text-anchor="middle" class="sub">escalation gate ↓</text>
  </g>

  <!-- escalation gate split -->
  <line x1="560" y1="1296" x2="560" y2="1330" stroke="#475569" stroke-width="2"/>
  <!-- escalate branch (right, red) -->
  <line x1="560" y1="1318" x2="900" y2="1318" stroke="#dc2626" stroke-width="2"/>
  <line x1="900" y1="1318" x2="900" y2="1338" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="1311" class="tag" fill="#dc2626">escalation = escalate</text>
  <g>
    <rect x="760" y="1340" width="430" height="84" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="975" y="1368" text-anchor="middle" class="h15" fill="#991b1b">Human lawyer — warm handoff</text>
    <text x="975" y="1390" text-anchor="middle" class="sub">only when information-gathering is exhausted</text>
    <text x="975" y="1410" text-anchor="middle" class="sub">best outcome: this is never reached</text>
  </g>

  <!-- self-serve / monitor branch (down) -->
  <line x1="560" y1="1330" x2="560" y2="1366" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="1352" text-anchor="middle" class="tag" fill="#16a34a">self_serve / monitor</text>
  <g>
    <rect x="300" y="1368" width="520" height="92" rx="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="560" y="1396" text-anchor="middle" class="h16" fill="#111827">User acts — sends the calibrated move</text>
    <text x="560" y="1419" text-anchor="middle" class="sub">demand letter goes out → counterparty replies, or stays silent past the deadline</text>
    <text x="560" y="1440" text-anchor="middle" class="sub">user reports the outcome back (uploads reply / "no response")</text>
  </g>

  <!-- loop back to orchestrator -->
  <polyline points="820,1414 900,1414 900,250 822,250" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowLoop)"/>
  <text x="912" y="840" transform="rotate(90 912 840)" text-anchor="middle" class="h14" fill="#2563eb">next round — re-run with the reply, stage++</text>
</svg>
