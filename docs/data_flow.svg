<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .lbl   { fill:#475569; font-size:14px; }
      .h     { font-weight:700; }
      .sub   { fill:#475569; font-size:13px; }
      .mono  { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
      .title { font-size:28px; font-weight:700; fill:#0f172a; }
      .stitle{ font-size:15px; fill:#475569; }
      .tag   { font-size:12px; font-weight:700; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="1680" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" class="title">Data Flow — UK Tenancy Deposit Return System</text>
  <text x="600" y="80" text-anchor="middle" class="stitle">Unstructured documents  →  VLM extraction (non-deterministic)  →  deterministic toolset</text>

  <!-- Legend -->
  <g>
    <rect x="915" y="470" width="270" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="935" y="498" class="h" font-size="15" fill="#0f172a">Legend</text>
    <rect x="935" y="512" width="22" height="16" rx="4" fill="#ccfbf1" stroke="#0d9488"/>
    <text x="967" y="525" class="lbl">AI / VLM — non-deterministic</text>
    <rect x="935" y="542" width="22" height="16" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="967" y="555" class="lbl">Validation / normalization</text>
    <rect x="935" y="572" width="22" height="16" rx="4" fill="#dcfce7" stroke="#16a34a"/>
    <text x="967" y="585" class="lbl">Deterministic — auditable</text>
    <rect x="935" y="602" width="22" height="16" rx="4" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="967" y="615" class="lbl">I/O &amp; orchestration</text>
    <rect x="935" y="632" width="22" height="16" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="967" y="645" class="lbl">Result</text>
  </g>

  <!-- N1 User -->
  <g>
    <rect x="330" y="100" width="520" height="56" rx="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="590" y="133" text-anchor="middle" class="h" font-size="17" fill="#111827">User drags &amp; drops documents</text>
  </g>
  <line x1="590" y1="156" x2="590" y2="194" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="180" class="lbl">files</text>

  <!-- N2 Documents -->
  <g>
    <rect x="330" y="196" width="520" height="96" rx="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="590" y="222" text-anchor="middle" class="h" font-size="16" fill="#111827">Documents (any number, any order)</text>
    <g class="mono" fill="#1f2937">
      <rect x="352" y="236" width="150" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <text x="427" y="254" text-anchor="middle">tenancy</text>
      <text x="427" y="269" text-anchor="middle">_agreement.pdf</text>
      <rect x="516" y="236" width="150" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <text x="591" y="254" text-anchor="middle">bank</text>
      <text x="591" y="269" text-anchor="middle">_statement.pdf</text>
      <rect x="680" y="236" width="150" height="40" rx="6" fill="#ffffff" stroke="#9ca3af"/>
      <text x="755" y="254" text-anchor="middle">dps / mydeposits</text>
      <text x="755" y="269" text-anchor="middle">/ tds  *.png</text>
    </g>
  </g>
  <line x1="590" y1="292" x2="590" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="314" class="lbl">PDF + PNG/JPEG bytes</text>

  <!-- N3 Orchestrator -->
  <g>
    <rect x="330" y="328" width="520" height="92" rx="12" fill="#dbeafe" stroke="#2563eb"/>
    <text x="590" y="356" text-anchor="middle" class="h" font-size="16" fill="#1e3a8a">Orchestrator  (upload handler / API route)</text>
    <text x="590" y="380" text-anchor="middle" class="sub">documentFromBuffer() · loadDocumentsFromDir()  →  build CaseInput</text>
    <text x="590" y="402" text-anchor="middle" class="mono" fill="#1e3a8a">CaseInput { documents[], context? }</text>
  </g>
  <line x1="590" y1="420" x2="590" y2="458" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="444" class="mono" fill="#475569">CaseInput</text>

  <!-- evaluateCase container -->
  <rect x="300" y="460" width="580" height="918" rx="16" fill="#f8fafc" stroke="#334155" stroke-dasharray="6 5"/>
  <text x="320" y="492" class="h" font-size="18" fill="#0f172a">evaluateCase()  —  public async entry point</text>

  <!-- E0 loadEnv -->
  <g>
    <rect x="350" y="506" width="480" height="46" rx="10" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="590" y="534" text-anchor="middle" class="mono" fill="#111827">loadEnv:  .env  →  ANTHROPIC_API_KEY / GEMINI_API_KEY</text>
  </g>
  <line x1="590" y1="552" x2="590" y2="582" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E1 provider select -->
  <g>
    <rect x="350" y="584" width="480" height="52" rx="10" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="590" y="606" text-anchor="middle" class="h" font-size="15" fill="#111827">defaultProvider()</text>
    <text x="590" y="626" text-anchor="middle" class="sub">select  Claude · Gemini · Mock  (EXTRACTION_PROVIDER / available key)</text>
  </g>
  <line x1="590" y1="636" x2="590" y2="666" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- E2 VLM extraction (AI) -->
  <g>
    <rect x="350" y="668" width="480" height="120" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <rect x="350" y="668" width="92" height="22" rx="10" fill="#0d9488"/>
    <text x="396" y="684" text-anchor="middle" class="tag" fill="#ffffff">VLM · AI</text>
    <text x="590" y="710" text-anchor="middle" class="h" font-size="15" fill="#134e4a">provider.extract(documents)</text>
    <text x="590" y="732" text-anchor="middle" class="sub">Claude tool-use  /  Gemini responseSchema  (forced schema)</text>
    <text x="590" y="752" text-anchor="middle" class="sub">PDFs → document channel · images → vision channel</text>
    <text x="590" y="772" text-anchor="middle" class="sub">reads facts + cites source doc — does NOT decide the law</text>
  </g>
  <line x1="590" y1="788" x2="590" y2="822" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="810" class="lbl">raw JSON (provider-shaped: may be "£980.77", "false")</text>

  <!-- E3 normalize (validation) -->
  <g>
    <rect x="350" y="824" width="480" height="104" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <rect x="350" y="824" width="118" height="22" rx="10" fill="#d97706"/>
    <text x="409" y="840" text-anchor="middle" class="tag" fill="#ffffff">VALIDATE</text>
    <text x="590" y="866" text-anchor="middle" class="h" font-size="15" fill="#7c2d12">normalizeTenantCase()</text>
    <text x="590" y="887" text-anchor="middle" class="sub">coerce dates · coerceAmount (strip £/commas) · apply context overrides</text>
    <text x="590" y="907" text-anchor="middle" class="sub">cross-check scheme searches · fail loudly on missing required facts</text>
  </g>
  <line x1="590" y1="928" x2="590" y2="962" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="950" class="mono" fill="#475569">TenantCase (validated, typed)</text>

  <!-- Rules engine container -->
  <rect x="330" y="964" width="520" height="386" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="330" y="964" width="150" height="24" rx="11" fill="#16a34a"/>
  <text x="405" y="981" text-anchor="middle" class="tag" fill="#ffffff">DETERMINISTIC</text>
  <text x="590" y="1010" text-anchor="middle" class="h" font-size="16" fill="#14532d">matchToolset()  —  the SVG decision tree, as code</text>

  <!-- R1 computeKeyDates -->
  <g>
    <rect x="370" y="1024" width="440" height="52" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="590" y="1046" text-anchor="middle" class="h" font-size="14" fill="#14532d">computeKeyDates()</text>
    <text x="590" y="1065" text-anchor="middle" class="sub">30-day protection deadline · 10-working-day return · 6-yr s214 longstop</text>
  </g>
  <line x1="590" y1="1076" x2="590" y2="1100" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R2 classify -->
  <g>
    <rect x="370" y="1102" width="440" height="92" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="590" y="1124" text-anchor="middle" class="h" font-size="14" fill="#14532d">classify()  —  decision tree</text>
    <text x="590" y="1145" text-anchor="middle" class="sub">Protected ≤30d + prescribed info?  No → NOT_PROTECTED_COURT</text>
    <text x="590" y="1164" text-anchor="middle" class="sub">Yes → landlord response: agrees · disputes · silent</text>
    <text x="590" y="1184" text-anchor="middle" class="mono" fill="#14532d">→ branch + reasoning[]</text>
  </g>
  <line x1="590" y1="1194" x2="590" y2="1218" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- R3 buildTools -->
  <g>
    <rect x="370" y="1220" width="440" height="60" rx="9" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="590" y="1244" text-anchor="middle" class="h" font-size="14" fill="#14532d">buildToolsForBranch()  —  Tools Arsenal</text>
    <text x="590" y="1264" text-anchor="middle" class="sub">each Tool: next action + concrete deadline (real date)</text>
  </g>
  <text x="590" y="1316" text-anchor="middle" class="mono" fill="#14532d">CaseAssessment { branch, branchLabel, keyDates, tools[] }</text>

  <!-- evaluateCase out arrow -->
  <line x1="590" y1="1378" x2="590" y2="1414" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="1402" class="mono" fill="#475569">DocumentAssessment</text>

  <!-- Output -->
  <g>
    <rect x="330" y="1416" width="520" height="118" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="590" y="1444" text-anchor="middle" class="h" font-size="16" fill="#5b21b6">DocumentAssessment  (returned to orchestrator)</text>
    <text x="590" y="1468" text-anchor="middle" class="sub">branch · tools[] (next action + deadline) · keyDates</text>
    <text x="590" y="1488" text-anchor="middle" class="sub">extractedCase  ·  extraction { provider, evidence[], warnings[] }</text>
    <text x="590" y="1512" text-anchor="middle" class="sub">audit trail: every fact cites its source document</text>
  </g>
  <line x1="590" y1="1534" x2="590" y2="1570" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="1558" class="lbl">branch + tools (next action + deadline)</text>

  <!-- Back to user -->
  <g>
    <rect x="330" y="1572" width="520" height="58" rx="12" fill="#e5e7eb" stroke="#6b7280"/>
    <text x="590" y="1606" text-anchor="middle" class="h" font-size="16" fill="#111827">Tenant: prioritised actions with deadlines</text>
  </g>
</svg>
